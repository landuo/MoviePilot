name: MoviePilot Builder Beta
on:
  workflow_dispatch:

# 声明所需权限：packages: write 用于推送镜像到 ghcr.io
permissions:
  contents: read
  packages: write

jobs:
  Docker-build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release version
        id: release_version
        run: |
          app_version=$(cat version.py |sed -ne "s/APP_VERSION\s=\s'v\(.*\)'/\1/gp")
          echo "app_version=$app_version" >> $GITHUB_ENV

      - name: Checkout Wiki Plugin Market
        uses: actions/checkout@v4
        with:
          repository: jxxghp/MoviePilot-Wiki
          ref: main
          path: .build/moviepilot-wiki
          sparse-checkout: plugin.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Generate Plugin Market Default
        id: plugin_market
        run: |
          python3 -m scripts.generate_plugin_market_default \
            --wiki-file .build/moviepilot-wiki/plugin.md \
            --config-file app/core/config.py
          wiki_commit=$(git -C .build/moviepilot-wiki rev-parse HEAD)
          echo "wiki_commit=$wiki_commit" >> "$GITHUB_OUTPUT"

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 仅推送到 GitHub Container Registry（ghcr.io），无需 Docker Hub 凭证
          # 镜像拉取地址示例：ghcr.io/landuo/moviepilot:beta
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=beta

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.moviepilot.plugin-market-wiki-revision=${{ steps.plugin_market.outputs.wiki_commit }}
          # 让 worker 二进制下载地址自动指向当前仓库（fork 自给自足）
          # 上游主仓库跑此 workflow 时 ${{ github.repository }} = jxxghp/MoviePilot；
          # 任何 fork 跑时则指向 fork 自身。需配合 build-workers.yml 已发布对应 release。
          build-args: |
            WORKERS_REPO=${{ github.repository }}
          cache-from: type=gha,scope=moviepilot-docker,version=2
          cache-to: type=gha,scope=moviepilot-docker,mode=max,version=2
